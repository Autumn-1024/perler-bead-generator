<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拼豆图纸生成器 - MARD 221</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#1a1a2e;--card:#16213e;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text2:#aaa;--border:#2a2a4a;--success:#4ecca3}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.header{background:linear-gradient(135deg,var(--accent2),var(--accent));padding:16px 20px;text-align:center}
.header h1{font-size:20px;font-weight:700;letter-spacing:1px}
.header p{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.container{max-width:600px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:18px}

/* Upload */
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:32px 16px;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:rgba(233,69,96,.05)}
.upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.upload-zone .icon{font-size:40px;margin-bottom:8px}
.upload-zone p{color:var(--text2);font-size:13px}
.upload-zone .preview{max-width:100%;max-height:200px;border-radius:8px;margin-top:12px;display:none}

/* Controls */
.control-row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.control-group{flex:1;min-width:120px}
.control-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px}
.control-group select,.control-group input[type=range]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;-webkit-appearance:none}
.control-group input[type=range]{padding:0;height:6px;border-radius:3px;cursor:pointer;margin-top:8px}
.control-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
.range-val{text-align:right;font-size:12px;color:var(--accent);margin-top:4px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:linear-gradient(135deg,var(--accent),#c0392b);color:#fff}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-success{background:linear-gradient(135deg,var(--success),#2ecc71);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-row{display:flex;gap:10px;margin-top:12px}
.btn-row .btn{flex:1}

/* Canvas area */
.canvas-wrap{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;max-height:70vh;border-radius:8px;background:#111}
.canvas-wrap canvas{display:block}
.zoom-controls{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100}
.zoom-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent2);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;max-height:300px;overflow-y:auto}
.stat-item{background:var(--bg);border-radius:8px;padding:8px 4px;text-align:center;border:1px solid var(--border)}
.stat-color{width:28px;height:28px;border-radius:6px;margin:0 auto 4px;border:1px solid rgba(255,255,255,.1)}
.stat-code{font-size:10px;font-weight:700;color:var(--text)}
.stat-count{font-size:11px;color:var(--accent);margin-top:2px}

/* Hidden */
.hidden{display:none!important}

/* Loading */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--text);margin-top:12px;font-size:14px}

/* Color palette modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:80vh;overflow-y:auto;padding:20px}
.modal h3{margin-bottom:12px}
.palette-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.palette-item{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative}
.palette-item.selected{border-color:var(--accent);transform:scale(1.1)}
.palette-item .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:4px;font-size:10px;white-space:nowrap;z-index:10}
.palette-item:hover .tip{display:block}

/* Info bar */
.info-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.info-chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text2)}
.info-chip span{color:var(--accent);font-weight:600}

/* Toggle */
.toggle-row{display:flex;align-items:center;justify-between;padding:8px 0}
.toggle-row label{font-size:13px;color:var(--text2)}
.toggle{position:relative;width:44px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;background:var(--border);border-radius:12px;cursor:pointer;transition:.3s}
.toggle .slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider:before{transform:translateX(20px)}

/* ===== Responsive: Tablet & Desktop ===== */
@media(min-width:768px){
  .container{max-width:820px;padding:20px}
  .header{padding:24px 32px}
  .header h1{font-size:24px}
  .card{padding:20px}
  .upload-zone{padding:48px 24px}
  .upload-zone .icon{font-size:48px}
  .stats-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));max-height:400px}
  .stat-color{width:34px;height:34px}
  .btn{padding:14px 24px;font-size:16px}
  .btn-row{gap:12px}
  .zoom-btn{width:48px;height:48px;font-size:22px}
}

/* ===== Responsive: Mobile ===== */
@media(max-width:480px){
  .container{padding:8px}
  .header{padding:12px 16px}
  .header h1{font-size:17px}
  .header p{font-size:11px}
  .card{padding:12px;border-radius:10px;margin-bottom:10px}
  .card-title{font-size:14px;margin-bottom:10px}
  .upload-zone{padding:24px 12px}
  .upload-zone .icon{font-size:36px}
  .upload-zone p{font-size:12px}

  /* Controls: stack tighter */
  .control-row{gap:8px;margin-bottom:10px}
  .control-group{min-width:100%}
  .control-group label{font-size:11px;margin-bottom:4px}
  .control-group select{padding:10px 12px;font-size:15px;border-radius:8px}
  .control-group input[type=range]{height:8px;margin-top:6px}
  .control-group input[type=range]::-webkit-slider-thumb{width:26px;height:26px;margin-top:-9px}

  /* Buttons: bigger touch targets */
  .btn{padding:14px 16px;font-size:16px;border-radius:12px}
  .btn-row{gap:8px;margin-top:10px}

  /* Toggles: easier to tap */
  .toggle-row{padding:10px 0}
  .toggle-row label{font-size:14px}
  .toggle{width:50px;height:28px}
  .toggle .slider{border-radius:14px}
  .toggle .slider:before{width:22px;height:22px;left:3px;bottom:3px}
  .toggle input:checked+.slider:before{transform:translateX(22px)}

  /* Stats: more compact */
  .stats-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:5px;max-height:260px}
  .stat-color{width:26px;height:26px}
  .stat-code{font-size:9px}
  .stat-count{font-size:10px}

  /* Info chips wrap */
  .info-bar{gap:5px}
  .info-chip{padding:3px 9px;font-size:10px}

  /* Zoom: bigger for fingers */
  .zoom-controls{bottom:16px;right:12px;gap:6px}
  .zoom-btn{width:48px;height:48px;font-size:22px}

  /* Canvas */
  .canvas-wrap{max-height:60vh}
}
</style>
</head>
<body>

<div class="header">
  <h1>🎨 拼豆图纸生成器</h1>
  <p>MARD 221 标准色板 · 52cm / 104cm 底板</p>
</div>

<div class="container">
  <!-- Upload -->
  <div class="card">
    <div class="card-title"><span class="icon">📷</span>上传图片</div>
    <div class="upload-zone" id="uploadZone">
      <input type="file" accept="image/*" id="fileInput">
      <div class="icon">📁</div>
      <p>点击上传或拖拽图片到此处<br><small>支持 JPG / PNG / WebP</small></p>
      <img class="preview" id="previewImg">
    </div>
  </div>

  <!-- Controls -->
  <div class="card" id="controlsCard">
    <div class="card-title"><span class="icon">⚙️</span>参数设置</div>
    <div class="control-row">
      <div class="control-group">
        <label>底板尺寸</label>
        <select id="boardSize">
          <option value="52">52cm × 52cm（标准）</option>
          <option value="104">104cm × 104cm（大号）</option>
        </select>
      </div>
      <div class="control-group">
        <label>拼豆直径</label>
        <select id="beadSize">
          <option value="5">5mm（标准）</option>
          <option value="2.6">2.6mm（迷你）</option>
        </select>
      </div>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>网格密度: <span id="gridVal">50</span> × <span id="gridVal2">50</span></label>
        <input type="range" id="gridDensity" min="10" max="200" value="50">
      </div>
    </div>
    <div class="control-row">
      <div class="control-group">
        <label>最大颜色数: <span id="colorLimitVal">不限</span></label>
        <input type="range" id="colorLimit" min="2" max="221" value="221">
      </div>
    </div>
    <div class="toggle-row">
      <label>显示色号标注</label>
      <div class="toggle"><input type="checkbox" id="showLabels" checked><span class="slider"></span></div>
    </div>
    <div class="toggle-row">
      <label>显示网格线</label>
      <div class="toggle"><input type="checkbox" id="showGrid" checked><span class="slider"></span></div>
    </div>
    <div class="toggle-row">
      <label>Floyd-Steinberg 抖动（更细腻）</label>
      <div class="toggle"><input type="checkbox" id="useDither"><span class="slider"></span></div>
    </div>
    <button class="btn btn-primary" id="generateBtn" disabled>🎯 生成拼豆图纸</button>
  </div>

  <!-- Result -->
  <div class="card hidden" id="resultCard">
    <div class="card-title"><span class="icon">📋</span>拼豆图纸</div>
    <div class="info-bar" id="infoBar"></div>
    <div class="canvas-wrap" id="canvasWrap" style="margin-top:12px">
      <canvas id="resultCanvas"></canvas>
    </div>
    <div class="btn-row">
      <button class="btn btn-success" id="exportPng">💾 保存图片</button>
      <button class="btn btn-outline" id="resetBtn">🔄 重新选择</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="card hidden" id="statsCard">
    <div class="card-title"><span class="icon">📊</span>用量统计</div>
    <div class="stats-grid" id="statsGrid"></div>
    <div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:13px;text-align:center;color:var(--text2)">
      总计: <span id="totalBeads" style="color:var(--accent);font-weight:700">0</span> 颗拼豆 ·
      使用 <span id="totalColors" style="color:var(--accent);font-weight:700">0</span> 种颜色
    </div>
  </div>
</div>

<!-- Zoom controls -->
<div class="zoom-controls hidden" id="zoomControls">
  <button class="zoom-btn" id="zoomIn">+</button>
  <button class="zoom-btn" id="zoomOut">−</button>
</div>

<!-- Loading -->
<div class="loading-overlay hidden" id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">正在生成图纸...</div>
</div>

  {code:'H21',hex:'#F7F3E4'},{code:'H22',hex:'#CACAD5'},{code:'H23',hex:'#9A9D94'},
  // M series (15)
  {code:'M1',hex:'#BCC6B8'},{code:'M2',hex:'#8AA385'},{code:'M3',hex:'#697D80'},{code:'M4',hex:'#DACEBE'},
  {code:'M5',hex:'#D0CCAA'},{code:'M6',hex:'#B0A782'},{code:'M7',hex:'#B4A497'},{code:'M8',hex:'#B38281'},
  {code:'M9',hex:'#A58767'},{code:'M10',hex:'#C5B1BC'},{code:'M11',hex:'#9F7494'},{code:'M12',hex:'#644749'},
  {code:'M13',hex:'#D19066'},{code:'M14',hex:'#C77361'},{code:'M15',hex:'#757D7B'}
];

// Parse hex to RGB
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

// Pre-compute RGB values
const PALETTE = MARD_COLORS.map(c => ({...c, rgb: hexToRgb(c.hex)}));

// ===== CIEDE2000 Color Difference =====
function rgbToLab(r,g,b) {
  // sRGB to linear
  r /= 255; g /= 255; b /= 255;
  r = r > 0.04045 ? Math.pow((r+0.055)/1.055,2.4) : r/12.92;
  g = g > 0.04045 ? Math.pow((g+0.055)/1.055,2.4) : g/12.92;
  b = b > 0.04045 ? Math.pow((b+0.055)/1.055,2.4) : b/12.92;
  // Linear RGB to XYZ (D65)
  let x = (r*0.4124564+g*0.3575761+b*0.1804375) / 0.95047;
  let y = (r*0.2126729+g*0.7151522+b*0.0721750) / 1.00000;
  let z = (r*0.0193339+g*0.1191920+b*0.9503041) / 1.08883;
  // XYZ to Lab
  const f = t => t > 0.008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  x = f(x); y = f(y); z = f(z);
  return [116*y - 16, 500*(x-y), 200*(y-z)];
}

function ciede2000(lab1, lab2) {
  const [L1,a1,b1] = lab1, [L2,a2,b2] = lab2;
  const deg = x => x*180/Math.PI, rad = x => x*Math.PI/180;
  const C1 = Math.sqrt(a1*a1+b1*b1), C2 = Math.sqrt(a2*a2+b2*b2);
  const Cab = (C1+C2)/2, Cab7 = Math.pow(Cab,7);
  const G = 0.5*(1-Math.sqrt(Cab7/(Cab7+Math.pow(25,7))));
  const a1p = a1*(1+G), a2p = a2*(1+G);
  const C1p = Math.sqrt(a1p*a1p+b1*b1), C2p = Math.sqrt(a2p*a2p+b2*b2);
  let h1p = deg(Math.atan2(b1,a1p)); if(h1p<0) h1p+=360;
  let h2p = deg(Math.atan2(b2,a2p)); if(h2p<0) h2p+=360;
  const dLp = L2-L1, dCp = C2p-C1p;
  let dhp;
  if(C1p*C2p===0) dhp=0;
  else if(Math.abs(h2p-h1p)<=180) dhp=h2p-h1p;
  else if(h2p-h1p>180) dhp=h2p-h1p-360;
  else dhp=h2p-h1p+360;
  const dHp = 2*Math.sqrt(C1p*C2p)*Math.sin(rad(dhp/2));
  const Lp = (L1+L2)/2, Cp = (C1p+C2p)/2;
  let hp;
  if(C1p*C2p===0) hp=h1p+h2p;
  else if(Math.abs(h1p-h2p)<=180) hp=(h1p+h2p)/2;
  else if(h1p+h2p<360) hp=(h1p+h2p+360)/2;
  else hp=(h1p+h2p-360)/2;
  const T = 1 - 0.17*Math.cos(rad(hp-30)) + 0.24*Math.cos(rad(2*hp)) + 0.32*Math.cos(rad(3*hp+6)) - 0.20*Math.cos(rad(4*hp-63));
  const SL = 1+0.015*Math.pow(Lp-50,2)/Math.sqrt(20+Math.pow(Lp-50,2));
  const SC = 1+0.045*Cp, SH = 1+0.015*Cp*T;
  const Cp7 = Math.pow(Cp,7);
  const RT = -2*Math.sqrt(Cp7/(Cp7+Math.pow(25,7)))*Math.sin(rad(60*Math.exp(-Math.pow((hp-275)/25,2))));
  return Math.sqrt(Math.pow(dLp/SL,2)+Math.pow(dCp/SC,2)+Math.pow(dHp/SH,2)+RT*(dCp/SC)*(dHp/SH));
}

// Pre-compute Lab for palette
const PALETTE_LAB = PALETTE.map(c => ({...c, lab: rgbToLab(...c.rgb)}));

// Find closest MARD color
function findClosestColor(r, g, b) {
  const lab = rgbToLab(r, g, b);
  let minDist = Infinity, best = PALETTE_LAB[0];
  for (const c of PALETTE_LAB) {
    const d = ciede2000(lab, c.lab);
    if (d < minDist) { minDist = d; best = c; }
  }
  return best;
}

// ===== App State =====
let imgData = null, imgW = 0, imgH = 0;
let currentScale = 1;
let lastResult = null; // {grid, w, h, stats}

// DOM
const $ = id => document.getElementById(id);
const fileInput = $('fileInput'), uploadZone = $('uploadZone'), previewImg = $('previewImg');
const boardSize = $('boardSize'), beadSize = $('beadSize'), gridDensity = $('gridDensity');
const gridVal = $('gridVal'), gridVal2 = $('gridVal2');
const colorLimit = $('colorLimit'), colorLimitVal = $('colorLimitVal');
const showLabels = $('showLabels'), showGrid = $('showGrid'), useDither = $('useDither');
const generateBtn = $('generateBtn'), resultCanvas = $('resultCanvas');
const resultCard = $('resultCard'), statsCard = $('statsCard'), controlsCard = $('controlsCard');
const statsGrid = $('statsGrid'), totalBeads = $('totalBeads'), totalColors = $('totalColors');
const infoBar = $('infoBar'), canvasWrap = $('canvasWrap');
const loading = $('loading'), loadingText = $('loadingText');
const zoomControls = $('zoomControls');

// Auto-calculate grid density from board size and bead size
function updateGridFromBoard() {
  const board = parseInt(boardSize.value); // cm
  const bead = parseFloat(beadSize.value); // mm
  const count = Math.round((board * 10) / bead);
  gridDensity.max = Math.min(count, 200);
  gridDensity.value = Math.min(count, 200);
  gridVal.textContent = gridDensity.value;
  gridVal2.textContent = gridDensity.value;
}
boardSize.addEventListener('change', updateGridFromBoard);
beadSize.addEventListener('change', updateGridFromBoard);

gridDensity.addEventListener('input', () => {
  gridVal.textContent = gridDensity.value;
  gridVal2.textContent = gridDensity.value;
});
colorLimit.addEventListener('input', () => {
  colorLimitVal.textContent = colorLimit.value >= 221 ? '不限' : colorLimit.value;
});

// File handling
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      imgW = img.width; imgH = img.height;
      // Limit source size for performance
      const maxSrc = 800;
      let sw = imgW, sh = imgH;
      if (sw > maxSrc || sh > maxSrc) {
        const ratio = Math.min(maxSrc/sw, maxSrc/sh);
        sw = Math.round(sw*ratio); sh = Math.round(sh*ratio);
      }
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      c.getContext('2d').drawImage(img, 0, 0, sw, sh);
      imgData = c.getContext('2d').getImageData(0, 0, sw, sh);
      previewImg.src = e.target.result;
      previewImg.style.display = 'block';
      generateBtn.disabled = false;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ===== Generate =====
generateBtn.addEventListener('click', generate);

function generate() {
  if (!imgData) return;
  loading.classList.remove('hidden');
  loadingText.textContent = '正在分析图片...';

  // Use setTimeout to allow UI update
  setTimeout(() => {
    const gridW = parseInt(gridDensity.value);
    const gridH = Math.round(gridW * (imgData.height / imgData.width));
    const limit = parseInt(colorLimit.value);
    const doDither = useDither.checked;

    loadingText.textContent = `正在像素化 (${gridW}×${gridH})...`;

    // Step 1: Resize image to grid dimensions
    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = gridW; tmpCanvas.height = gridH;
    const tmpCtx = tmpCanvas.getContext('2d');
    tmpCtx.drawImage(document.createElement('canvas').getContext('2d').canvas, 0, 0);
    // Use OffscreenCanvas or regular canvas
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = imgData.width; srcCanvas.height = imgData.height;
    srcCanvas.getContext('2d').putImageData(imgData, 0, 0);
    tmpCtx.drawImage(srcCanvas, 0, 0, gridW, gridH);
    const smallData = tmpCtx.getImageData(0, 0, gridW, gridH);

    // Step 2: Color matching
    loadingText.textContent = '正在匹配拼豆颜色...';
    const grid = [];
    const stats = {};
    const pixels = smallData.data;

    // Floyd-Steinberg dithering
    const errW = gridW, errH = gridH;
    const errR = new Float32Array(errW * errH);
    const errG = new Float32Array(errW * errH);
    const errB = new Float32Array(errW * errH);
    for (let i = 0; i < errW * errH; i++) {
      errR[i] = pixels[i*4];
      errG[i] = pixels[i*4+1];
      errB[i] = pixels[i*4+2];
    }

    for (let y = 0; y < gridH; y++) {
      grid[y] = [];
      for (let x = 0; x < gridW; x++) {
        const idx = y * errW + x;
        let r = Math.max(0, Math.min(255, Math.round(errR[idx])));
        let g = Math.max(0, Math.min(255, Math.round(errG[idx])));
        let b = Math.max(0, Math.min(255, Math.round(errB[idx])));

        const match = findClosestColor(r, g, b);
        grid[y][x] = match;

        if (doDither) {
          const er = r - match.rgb[0];
          const eg = g - match.rgb[1];
          const eb = b - match.rgb[2];
          const spread = [[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]];
          for (const [dx,dy,w] of spread) {
            const nx = x+dx, ny = y+dy;
            if (nx >= 0 && nx < errW && ny >= 0 && ny < errH) {
              const ni = ny * errW + nx;
              errR[ni] += er * w;
              errG[ni] += eg * w;
              errB[ni] += eb * w;
            }
          }
        }

        const code = match.code;
        stats[code] = (stats[code] || 0) + 1;
      }
    }

    // Limit colors if needed
    if (limit < 221) {
      const sorted = Object.entries(stats).sort((a,b) => b[1]-a[1]);
      const keepCodes = new Set(sorted.slice(0, limit).map(e => e[0]));
      // Re-map removed colors to nearest kept
      const keepPalette = PALETTE_LAB.filter(c => keepCodes.has(c.code));
      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          if (!keepCodes.has(grid[y][x].code)) {
            const lab = grid[y][x].lab;
            let minD = Infinity, best = keepPalette[0];
            for (const c of keepPalette) {
              const d = ciede2000(lab, c.lab);
              if (d < minD) { minD = d; best = c; }
            }
            grid[y][x] = best;
          }
        }
      }
      // Recount stats
      const newStats = {};
      for (let y = 0; y < gridH; y++)
        for (let x = 0; x < gridW; x++)
          newStats[grid[y][x].code] = (newStats[grid[y][x].code] || 0) + 1;
      Object.keys(stats).forEach(k => delete stats[k]);
      Object.assign(stats, newStats);
    }

    lastResult = { grid, w: gridW, h: gridH, stats };
    loadingText.textContent = '正在绘制图纸...';

    setTimeout(() => {
      drawResult();
      loading.classList.add('hidden');
    }, 50);
  }, 50);
}

// ===== Draw Result =====
function drawResult() {
  if (!lastResult) return;
  const { grid, w, h } = lastResult;
  const showL = showLabels.checked;
  const showG = showGrid.checked;

  // Calculate cell size based on screen width (reserve space for coordinate labels)
  const labelMargin = 24;
  const wrapW = canvasWrap.clientWidth - 4 - labelMargin;
  let cellSize = Math.max(8, Math.min(40, Math.floor(wrapW / w)));
  cellSize = Math.round(cellSize * currentScale);

  const canvas = resultCanvas;
  const ctx = canvas.getContext('2d');
  canvas.width = w * cellSize + labelMargin;
  canvas.height = h * cellSize + labelMargin;

  // Background
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Coordinate label style
  ctx.font = 'bold 10px sans-serif';
  ctx.fillStyle = '#888';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Column labels (A, B, C, ... Z, AA, AB...)
  const colLabel = n => {
    let s = '';
    while (n >= 0) { s = String.fromCharCode(65 + n % 26) + s; n = Math.floor(n / 26) - 1; }
    return s;
  };
  for (let x = 0; x < w; x++) {
    ctx.fillText(colLabel(x), labelMargin + x * cellSize + cellSize / 2, labelMargin / 2);
  }

  // Row labels (1, 2, 3, ...)
  ctx.textAlign = 'right';
  for (let y = 0; y < h; y++) {
    ctx.fillText(y + 1, labelMargin - 4, labelMargin + y * cellSize + cellSize / 2);
  }

  // Draw cells (offset by labelMargin)
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const cell = grid[y][x];
      const px = labelMargin + x * cellSize, py = labelMargin + y * cellSize;

      // Cell fill
      ctx.fillStyle = cell.hex;
      ctx.fillRect(px, py, cellSize, cellSize);

      // Label
      if (showL && cellSize >= 16) {
        ctx.fillStyle = getLuminance(...cell.rgb) > 0.5 ? '#000' : '#fff';
        ctx.font = `bold ${Math.max(7, cellSize * 0.3)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(cell.code, px + cellSize/2, py + cellSize/2);
      }
    }
  }

  // Grid lines (offset by labelMargin)
  if (showG && cellSize >= 4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    for (let x = 0; x <= w; x++) {
      ctx.moveTo(labelMargin + x * cellSize, labelMargin);
      ctx.lineTo(labelMargin + x * cellSize, labelMargin + h * cellSize);
    }
    for (let y = 0; y <= h; y++) {
      ctx.moveTo(labelMargin, labelMargin + y * cellSize);
      ctx.lineTo(labelMargin + w * cellSize, labelMargin + y * cellSize);
    }
    ctx.stroke();
  }

  // Show cards
  resultCard.classList.remove('hidden');
  statsCard.classList.remove('hidden');
  zoomControls.classList.remove('hidden');

  // Info bar
  infoBar.innerHTML = `
    <span class="info-chip">尺寸: <span>${w}×${h}</span></span>
    <span class="info-chip">底板: <span>${boardSize.value}cm</span></span>
    <span class="info-chip">豆径: <span>${beadSize.value}mm</span></span>
    <span class="info-chip">颜色: <span>${Object.keys(lastResult.stats).length}</span></span>
  `;

  // Stats
  const sorted = Object.entries(lastResult.stats).sort((a,b) => b[1]-a[1]);
  let total = 0;
  statsGrid.innerHTML = sorted.map(([code, count]) => {
    total += count;
    const c = PALETTE.find(p => p.code === code);
    return `<div class="stat-item">
      <div class="stat-color" style="background:${c?.hex||'#888'}"></div>
      <div class="stat-code">${code}</div>
      <div class="stat-count">${count}</div>
    </div>`;
  }).join('');
  totalBeads.textContent = total;
  totalColors.textContent = sorted.length;

  // Scroll to result
  resultCard.scrollIntoView({ behavior: 'smooth' });
}

function getLuminance(r,g,b) {
  return (0.299*r + 0.587*g + 0.114*b) / 255;
}

// Zoom
$('zoomIn').addEventListener('click', () => { currentScale = Math.min(3, currentScale + 0.3); drawResult(); });
$('zoomOut').addEventListener('click', () => { currentScale = Math.max(0.3, currentScale - 0.3); drawResult(); });

// Re-draw on toggle change
[showLabels, showGrid].forEach(el => el.addEventListener('change', () => { if(lastResult) drawResult(); }));

// Export PNG
$('exportPng').addEventListener('click', () => {
  if (!lastResult) return;
  const link = document.createElement('a');
  link.download = `拼豆图纸_${lastResult.w}x${lastResult.h}.png`;
  link.href = resultCanvas.toDataURL('image/png');
  link.click();
});

// Reset
$('resetBtn').addEventListener('click', () => {
  resultCard.classList.add('hidden');
  statsCard.classList.add('hidden');
  zoomControls.classList.add('hidden');
  previewImg.style.display = 'none';
  generateBtn.disabled = true;
  imgData = null;
  lastResult = null;
  currentScale = 1;
  fileInput.value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Init
updateGridFromBoard();
</script>
</body>
</html>
